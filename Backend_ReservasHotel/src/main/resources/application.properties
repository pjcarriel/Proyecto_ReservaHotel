spring.application.name=Backend_ReservasHotel
server.port=8080

# Configuración personal de cada uno (puerto y contraseña de MySQL).
# Copiar application-local.properties.example como application-local.properties
# en la carpeta Backend_ReservasHotel. Ese archivo NO se sube a git.
spring.config.import=optional:file:./application-local.properties

# Base de datos MySQL (la base se crea sola si no existe)
# Valores que se pueden cambiar sin editar este archivo:
#   DB_PORT, DB_USERNAME, DB_PASSWORD  (o DB_URL para cambiar la URL completa)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:${DB_PORT:3306}/reservas_hotel_db?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT: clave en Base64 de al menos 256 bits y duración del token en milisegundos (8 horas).
# La clave por defecto es solo para desarrollo; en producción usar la variable JWT_SECRET.
jwt.secret=${JWT_SECRET:8hwE1MqQ7W2sRFAqqDOJo+p2QJCJTXwxtoIex32R8bA=}
jwt.expiration=${JWT_EXPIRATION:28800000}

# Usuario administrador que se crea al arrancar si la tabla usuario está vacía.
# Cambiar el password después del primer ingreso (o definir ADMIN_PASSWORD).
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:Admin2026*}

# CORS: origen del frontend Angular (separar con comas si hay varios)
app.cors.allowed-origins=http://localhost:4200
