spring.application.name=Backend_ReservasHotel
server.port=8080

# Base de datos MySQL (la base se crea sola si no existe)
spring.datasource.url=jdbc:mysql://localhost:3306/reservas_hotel_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CORS: origen del frontend Angular (separar con comas si hay varios)
app.cors.allowed-origins=http://localhost:4200
